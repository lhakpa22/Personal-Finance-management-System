{% extends "base.html" %}

{% block content %}

<h1>Registered Users</h1>

<table>
    <tr>
        <th>User ID</th>
        <th>Username</th>
    </tr>

    {% for user in users %}
    <tr>
        <td>{{ 1000 + user.id }}</td>
        <td>{{ user.username }}</td>
    </tr>
    {% endfor %}

</table>

{% endblock %}
