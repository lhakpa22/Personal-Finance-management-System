{% extends "base.html" %}

{% block content %}
<h1>Login</h1>
<form method="POST">
    <label>Email</label>
    <input type="email" name="email" required>

    <label>Password</label>
    <input type="password" name="password" required>

    <button type="submit">Login</button>
    <div class="forgot-password">
        <a href="{{ url_for('forgot_password') }}">
            Forgotten password?
        </a>
    </div>

</form>
{% endblock %}
