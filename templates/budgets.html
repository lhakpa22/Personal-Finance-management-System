{% extends "base.html" %}

{% block content %}

<h1>Budget Management</h1>

<!-- Form for adding a new budget -->
<form method="POST">
    <label>Category</label>
    <input type="text" name="category" required>

    <label>Monthly Budget Limit (£)</label>
    <input type="number" step="0.01" name="monthly_limit" required>

    <button type="submit">Add Budget</button>
</form>

<h2>Your Budgets</h2>
{% if budgets %}
<table>
    <tr>
        <th>Category</th>
        <th>Monthly Limit</th>
        <th>Actions</th>
    </tr>
    {% for budget in budgets %}
    <tr>
        <form method="POST" action="{{ url_for('update_budget', budget_id=budget.id) }}">
            <td>
                <input type="text" name="category" value="{{ budget.category }}" required>
            </td>

            <td>
                <input type="number" step="0.01" name="monthly_limit" value="{{ budget.monthly_limit }}" required>
            </td>

            <td>
                <button class="btn-edit" type="submit">Update</button>
        </form>

        <form method="POST" action="{{ url_for('delete_budget', budget_id=budget.id) }}" style="display:inline;">
            <button class="btn-delete" type="submit" onclick="return confirm('Delete this budget?');">
                Delete
            </button>
        </form>
        </td>
    </tr>
    {% endfor %}
</table>
{% else %}
<p>No budgets added yet.</p>
{% endif %}
{% endblock %}
